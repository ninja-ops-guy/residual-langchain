[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-langchain"
version = "1.0.0"
description = "LangChain callback adapter for RESIDUAL run attestation"
requires-python = ">=3.10"
dependencies = ["residual-sdk>=1.0.0", "langchain-core>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]
